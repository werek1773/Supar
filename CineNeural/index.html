<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineNeural</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="mount"><canvas id="bg-canvas"></canvas></div>
  <div id="labels"></div>

  <div id="search-wrap">
    <div id="search-inner">
      <svg id="search-ico" viewBox="0 0 20 20" fill="none">
        <circle cx="8.5" cy="8.5" r="5" stroke="white" stroke-opacity=".25" stroke-width="1.5"/>
        <path d="M13 13l3.5 3.5" stroke="white" stroke-opacity=".25" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="search-input" placeholder="Search any movie, actor, genre…" autocomplete="off" spellcheck="false"/>
      <div id="search-loader"></div>
    </div>
    <div id="dropdown"></div>
  </div>

  <div id="intro">
    <div id="intro-title">CineNeural</div>
    <div id="intro-sub">Build your taste graph. Discover what to watch next.</div>
  </div>

  <div id="nc" class="hidden"><span id="nc-n">0</span> nodes · <span id="nc-c">0</span> connections</div>

  <div id="thinking" class="pill hidden">
    <div class="pill-dot pulsing"></div>
    <span>Analyzing</span><span class="dots"><span>.</span><span>.</span><span>.</span></span>
  </div>

  <div id="rec-pill" class="pill hidden" role="button" tabindex="0">
    <div class="pill-dot rec-glow"></div>
    <div id="rec-pill-body">
      <span id="rec-title">—</span>
      <span id="rec-score" class="muted"></span>
    </div>
    <svg class="pill-arrow" viewBox="0 0 12 12" fill="none">
      <path d="M4 2l4 4-4 4" stroke="white" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="panel">
    <button id="p-close" aria-label="Close">✕</button>
    <div id="p-poster">
      <canvas id="p-poster-cv" width="370" height="220"></canvas>
      <img id="p-poster-img" alt="" />
      <div id="p-poster-fade"></div>
      <div id="p-poster-text">
        <div id="p-title">—</div>
        <div id="p-orig" class="muted-sm"></div>
      </div>
    </div>
    <div id="p-body">
      <div id="p-match">
        <div>
          <div id="p-pct">—</div>
          <div class="label-tag">Neural Match</div>
        </div>
        <div id="p-why" class="muted-sm"></div>
      </div>
      <div id="p-meta">
        <span id="p-stars"></span>
        <span id="p-rval"></span>
        <span class="muted-sm" id="p-yr"></span>
      </div>
      <div class="chip-row" id="p-genres"></div>
      <div class="p-sec"><div class="sec-lbl">Description</div><div id="p-plot" class="body-text"></div></div>
      <div class="p-sec"><div class="sec-lbl">Director</div><div class="chip-row" id="p-dir"></div></div>
      <div class="p-sec"><div class="sec-lbl">Cast</div><div class="chip-row" id="p-cast"></div></div>
      <button id="p-add">Add to Network</button>
    </div>
  </div>

  <div id="legend">
    <div class="leg"><div class="leg-d" style="--c:#a8d8ff"></div>Movie</div>
    <div class="leg"><div class="leg-d" style="--c:#d4b4ff"></div>Actor</div>
    <div class="leg"><div class="leg-d" style="--c:#a8ffcc"></div>Genre</div>
    <div class="leg"><div class="leg-d" style="--c:#ffd4a8"></div>Theme</div>
  </div>

  <!-- ── Trending top 4 widget ── -->
  <div id="trending">
    <div id="trending-header">
      <span id="trending-label">Today's picks</span>
      <span id="trending-date"></span>
    </div>
    <div id="trending-list"></div>
  </div>

  <div id="hint" class="hidden">Click node to select · Click another to connect · Double-click removes</div>
  <div id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/omdb.js"></script>
  <script src="js/network.js"></script>
  <script src="js/trending.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
